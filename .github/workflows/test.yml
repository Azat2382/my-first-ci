name: Мой первый CI пайплайн

# Когда запускать этот процесс?
on:
  push:
    branches: [ "main" ] # При каждом отправлении кода в ветку main

jobs:
  # Название задачи
  build-and-test:
    # На каком сервере запускать бота? (GitHub предоставляет сервер на Ubuntu)
    runs-on: ubuntu-latest

    # Последовательность шагов
    steps:
      # 1. Скачать код из нашего репозитория на виртуальную машину
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      # 2. Выполнить простую команду
      - name: Проверяем версию Linux
        run: lsb_release -a

      # 3. Симулируем запуск тестов
      - name: Запуск тестов
        run: |
          echo "Запускаем проверку кода..."
          echo "Тест 1: Успешно!"
          echo "Тест 2: Успешно!"
